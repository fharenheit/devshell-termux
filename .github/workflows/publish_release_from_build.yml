name: Publish Release From Build

# Creates a GitHub release from the APKs already built by a successful `Build` workflow run,
# without rebuilding them, so the released APKs are exactly the ones that were built and tested.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID of the successful `Build` workflow run whose APKs should be released"
        required: true
      tag:
        description: "Tag name of the release to create, like `v0.118.3-ko.1`"
        required: true
      notes:
        description: "Release notes"
        required: false
        default: ""
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
      TAG: ${{ inputs.tag }}
      NOTES: ${{ inputs.notes }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - name: Validate build run
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          name="$(jq -r .name <<< "$run_json")"
          conclusion="$(jq -r .conclusion <<< "$run_json")"
          head_sha="$(jq -r .head_sha <<< "$run_json")"
          if [ "$name" != "Build" ] || [ "$conclusion" != "success" ]; then
            echo "Run $RUN_ID is '$name' with conclusion '$conclusion', expected a successful 'Build' run."
            exit 1
          fi
          echo "HEAD_SHA=$head_sha" >> "$GITHUB_ENV"

      - name: Download APKs from build run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: artifacts
          merge-multiple: true

      - name: Create release
        shell: bash
        run: |
          set -euo pipefail
          ls -la artifacts
          (cd artifacts && sha256sum -c sha256sums)
          args=(--repo "$GITHUB_REPOSITORY" --target "$HEAD_SHA" --title "$TAG" --notes "$NOTES")
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}" artifacts/*.apk artifacts/sha256sums
