name: Publish Release From Build

# Creates a GitHub release from the APKs already built by a successful `Build` workflow run,
# without rebuilding them, so the released APKs are exactly the ones that were built and tested.
#
# Pushing a `v*` tag for a commit that has a successful `Build` run publishes a release for it,
# with the annotated tag message as the release notes.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID of the successful `Build` workflow run whose APKs should be released"
        required: true
      tag:
        description: "Tag name of the release to create, like `v0.118.3-ko.1`"
        required: true
      notes:
        description: "Release notes"
        required: false
        default: ""
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
      TAG: ${{ inputs.tag || github.ref_name }}
      NOTES: ${{ inputs.notes }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - name: Find build run for tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/debug_build.yml/runs?head_sha=$tag_sha&status=success" --jq '.workflow_runs[0].id // empty')"
          if [ -z "$run_id" ]; then
            echo "No successful 'Build' run found for '$TAG' commit $tag_sha."
            exit 1
          fi
          echo "RUN_ID=$run_id" >> "$GITHUB_ENV"
          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')"
          if [ "${tag_object%% *}" = "tag" ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/tags/${tag_object#* }" --jq .message > "$RUNNER_TEMP/notes.md"
            {
              echo "NOTES<<__NOTES_EOF__"
              cat "$RUNNER_TEMP/notes.md"
              echo "__NOTES_EOF__"
            } >> "$GITHUB_ENV"
          fi

      - name: Validate build run
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          name="$(jq -r .name <<< "$run_json")"
          conclusion="$(jq -r .conclusion <<< "$run_json")"
          head_sha="$(jq -r .head_sha <<< "$run_json")"
          if [ "$name" != "Build" ] || [ "$conclusion" != "success" ]; then
            echo "Run $RUN_ID is '$name' with conclusion '$conclusion', expected a successful 'Build' run."
            exit 1
          fi
          echo "HEAD_SHA=$head_sha" >> "$GITHUB_ENV"

      - name: Download APKs from build run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
          path: artifacts
          merge-multiple: true

      - name: Create release
        shell: bash
        run: |
          set -euo pipefail
          ls -la artifacts
          (cd artifacts && sha256sum -c sha256sums)
          args=(--repo "$GITHUB_REPOSITORY" --target "$HEAD_SHA" --title "$TAG" --notes "$NOTES")
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}" artifacts/*.apk artifacts/sha256sums
